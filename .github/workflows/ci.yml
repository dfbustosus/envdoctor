name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Ubuntu 24.04 / Node.js 24 / release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Show tool versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run complete release gate
        run: npm run ci

      - name: Upload npm diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-logs-release-gate
          path: ~/.npm/_logs/**
          if-no-files-found: ignore
          retention-days: 5

  compatibility:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node-version: 22.12.0
            timeout: 15
          - os: windows-2025
            node-version: 24.x
            timeout: 20
          - os: macos-15
            node-version: 24.x
            timeout: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Show tool versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify source and build
        run: npm run verify

      - name: Validate packed consumers
        run: npm run pack:validate

      - name: Upload npm diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-logs-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: ~/.npm/_logs/**
          if-no-files-found: ignore
          retention-days: 5
