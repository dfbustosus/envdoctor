name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected tag, for example v0.1.0
        required: true
        type: string
      confirmation:
        description: Exact package identifier, for example env-doctor@0.1.0
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      checks: read
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Require dispatch from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release workflow must be dispatched from main." >&2
          exit 1

      - name: Checkout trusted main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Validate protected tag and release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: npm run release:validate

      - name: Verify required CI checks for release commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-checks.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run complete release gate
        run: npm run ci

      - name: Build exact release artifact
        run: npm run pack:validate -- --output-dir release-artifact

      - name: Record package version
        id: package
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').version + '\n')"

      - name: Upload validated tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: env-doctor-${{ steps.package.outputs.version }}
          path: |
            release-artifact/env-doctor-${{ steps.package.outputs.version }}.tgz
            release-artifact/env-doctor-${{ steps.package.outputs.version }}.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish approved artifact
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js for npm
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      - name: Download validated tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: env-doctor-${{ needs.validate.outputs.version }}
          path: release-artifact

      - name: Publish to npm with provenance
        run: |
          cd release-artifact
          sha256sum --check "env-doctor-${{ needs.validate.outputs.version }}.tgz.sha256"
          npm publish "env-doctor-${{ needs.validate.outputs.version }}.tgz" --access public --provenance --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
