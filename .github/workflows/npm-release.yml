name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected tag, for example v0.1.1
        required: true
        type: string
      confirmation:
        description: Exact package identifier, for example dotenv-drift@0.1.1
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      checks: read
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
      tarball: ${{ steps.package.outputs.tarball }}
    steps:
      - name: Require dispatch from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release workflow must be dispatched from main." >&2
          exit 1

      - name: Checkout trusted main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Validate protected tag and release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: npm run release:validate

      - name: Verify required CI checks for release commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-checks.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run complete release gate
        run: npm run ci

      - name: Build exact release artifact
        run: npm run pack:validate -- --output-dir release-artifact

      - name: Record package version
        id: package
        run: node -e "const fs = require('node:fs'); const pkg = require('./package.json'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + pkg.version + '\ntarball=' + pkg.name + '-' + pkg.version + '.tgz\n')"

      - name: Upload validated tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ steps.package.outputs.version }}
          path: |
            release-artifact/${{ steps.package.outputs.tarball }}
            release-artifact/${{ steps.package.outputs.tarball }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish approved artifact
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js for npm
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      - name: Download validated tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ needs.validate.outputs.version }}
          path: release-artifact

      - name: Publish to npm with provenance
        run: |
          cd release-artifact
          sha256sum --check "${{ needs.validate.outputs.tarball }}.sha256"
          npm publish "${{ needs.validate.outputs.tarball }}" --access public --provenance --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
